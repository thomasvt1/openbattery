blueprint:
  name: "OpenBattery - Dismiss Predictive Charging Notifications"
  description: >
    Automatically dismisses OpenBattery persistent notifications related to
    predictive grid charging, including evaluations, price slots, and evening
    re-evaluations.

    The notification can appear briefly before Home Assistant runs this
    automation. Disable the created automation to receive the notifications
    again.
  domain: automation
  source_url: "https://github.com/thomasvt1/openbattery/blob/openbattery/blueprints/dismiss_predictive_charging_notifications_blueprint.yaml"

trigger:
  - platform: persistent_notification
    update_type:
      - added
      - updated

condition:
  - condition: template
    value_template: >
      {{ (trigger.notification.notification_id | string)
         .startswith('marstek_venus_predictive_charging_') }}

action:
  - service: persistent_notification.dismiss
    data:
      notification_id: "{{ trigger.notification.notification_id }}"

mode: queued
max: 10
